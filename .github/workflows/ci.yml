name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze & Test (Flutter + D-Transcreate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop & test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter unit & preservation test suite
        run: flutter test

      - name: Smoke-test embedded D-Transcreate v1.1.0 Python engine
        run: python3 tools/d_transcreate/book_ops.py --help
